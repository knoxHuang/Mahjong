<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="/icons/app-touch-icon.png">
    <title>厦门麻将计分器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #000;
            color: #fff;
            height: 100dvh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .calc {
            max-width: 420px;
            height: 100%;
            margin: 0 auto;
            padding: 0 16px 20px;
            display: flex;
            flex-direction: column;
        }
        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 8px;
            text-align: right;
            min-height: 0;
        }
        .type-label {
            font-size: 18px;
            color: #8e8e93;
        }
        .fan-display {
            font-size: 72px;
            font-weight: 200;
            line-height: 1.1;
        }
        .fan-display .unit {
            font-size: 22px;
            color: #8e8e93;
            font-weight: 400;
            margin-left: 2px;
        }
        .results {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            margin: 8px 0;
        }
        .results.show { display: grid; }
        .result-item {
            background: #1c1c1e;
            padding: 10px 8px;
            text-align: center;
        }
        .result-label {
            font-size: 12px;
            color: #8e8e93;
            margin-bottom: 2px;
        }
        .result-value {
            font-size: 24px;
            font-weight: 600;
            color: #ff9f0a;
        }
        .types {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .type-btn {
            padding: 10px 0;
            border-radius: 999px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            background: #a5a5a5;
            color: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .type-btn:active { background: #d9d9d9; }
        .type-btn.active { background: #ff9f0a; color: #fff; }
        .type-btn.active:active { background: #ffc55c; }
        .pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .btn {
            height: 64px;
            border-radius: 999px;
            border: none;
            font-size: 28px;
            font-weight: 400;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn.num { background: #333; color: #fff; }
        .btn.num:active { background: #737373; }
        .btn.func { background: #a5a5a5; color: #000; font-size: 22px; }
        .btn.func:active { background: #d9d9d9; }
        .btn.eq {
            grid-column: span 3;
            background: #ff9f0a;
            color: #fff;
            font-size: 30px;
            font-weight: 500;
        }
        .btn.eq:active { background: #ffc55c; }
    </style>
</head>
<body>
    <div class="calc">
        <div class="display">
            <div class="type-label" id="typeLabel">胡</div>
            <div class="fan-display">
                <span id="fanNum">0</span><span class="unit">番</span>
            </div>
        </div>

        <div class="results" id="results">
            <div class="result-item">
                <div class="result-label">闲家</div>
                <div class="result-value" id="r-xian">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">庄家</div>
                <div class="result-value" id="r-zhuang">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">二庄</div>
                <div class="result-value" id="r-er">-</div>
            </div>
            <div class="result-item">
                <div class="result-label">三庄</div>
                <div class="result-value" id="r-san">-</div>
            </div>
        </div>

        <div class="types">
            <button class="type-btn active" data-mult="1">胡</button>
            <button class="type-btn" data-mult="2">自摸</button>
            <button class="type-btn" data-mult="4">游金</button>
            <button class="type-btn" data-mult="8">双游</button>
            <button class="type-btn" data-mult="16">三金倒</button>
        </div>

        <div class="pad">
            <button class="btn num" data-n="7">7</button>
            <button class="btn num" data-n="8">8</button>
            <button class="btn num" data-n="9">9</button>
            <button class="btn num" data-n="4">4</button>
            <button class="btn num" data-n="5">5</button>
            <button class="btn num" data-n="6">6</button>
            <button class="btn num" data-n="1">1</button>
            <button class="btn num" data-n="2">2</button>
            <button class="btn num" data-n="3">3</button>
            <button class="btn func" id="btnAC">AC</button>
            <button class="btn num" data-n="0">0</button>
            <button class="btn func" id="btnDel">⌫</button>
            <button class="btn eq" id="btnEq">=</button>
        </div>
    </div>

    <script>
        let mult = 1;
        let fan = '0';
        let hasResult = false;
        const fanEl = document.getElementById('fanNum');
        const resEl = document.getElementById('results');
        const typeLabelEl = document.getElementById('typeLabel');

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.onclick = () => {
                mult = +btn.dataset.mult;
                typeLabelEl.textContent = btn.textContent;
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (hasResult) calc();
            };
        });

        document.querySelectorAll('.btn.num').forEach(btn => {
            btn.onclick = () => pressNum(btn.dataset.n);
        });

        document.getElementById('btnAC').onclick = clearAll;
        document.getElementById('btnDel').onclick = backspace;
        document.getElementById('btnEq').onclick = calc;

        document.addEventListener('keydown', e => {
            if (e.key >= '0' && e.key <= '9') pressNum(e.key);
            else if (e.key === 'Enter') calc();
            else if (e.key === 'Backspace') backspace();
            else if (e.key === 'Escape') clearAll();
        });

        function pressNum(n) {
            if (hasResult) { fan = '0'; hasResult = false; resEl.classList.remove('show'); }
            fan = fan === '0' ? n : (fan.length < 2 ? fan + n : fan);
            fanEl.textContent = fan;
        }

        function clearAll() {
            fan = '0';
            hasResult = false;
            resEl.classList.remove('show');
            fanEl.textContent = fan;
        }

        function backspace() {
            if (hasResult) { hasResult = false; resEl.classList.remove('show'); }
            fan = fan.length > 1 ? fan.slice(0, -1) : '0';
            fanEl.textContent = fan;
        }

        function calc() {
            const f = parseInt(fan) || 0;
            const bases = { xian: 8, zhuang: 16, er: 32, san: 48 };
            for (const [pos, base] of Object.entries(bases)) {
                document.getElementById('r-' + pos).textContent = (base + f) * mult;
            }
            resEl.classList.add('show');
            hasResult = true;
        }
    </script>
</body>
</html>
